events {}

http {
    # Rate Limiting: не более 10 запросов в минуту с одного клиента (IP-адреса).
    # Без burst: один запрос раз в 6 с, в любом окне 60 с проходит не больше 10 запросов
    limit_req_zone $binary_remote_addr zone=per_client:10m rate=10r/m;
    # при превышении лимита клиент получает 429 Too Many Requests вместо 503 по умолчанию
    limit_req_status 429;

    # Настройка upstream для балансировки нагрузки
    upstream backend_servers {
        server backend1.example.com;
        server backend2.example.com;
        server backend3.example.com;
    }

    server {
        listen 80;

        location / {
            limit_req zone=per_client;
            proxy_pass http://backend_servers;
        }
    }
}
